[project]
name = "plctap"
version = "0.5.5"
description = "Agent-PLC MCP Server: connect, read and diagnose Modbus / FINS / MELSEC / Siemens S7 / IEC 60870-5-104 / EtherNet/IP PLCs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "mcp",
    "modbus",
    "fins",
    "melsec",
    "s7",
    "s7comm",
    "siemens",
    "plc",
    "industrial",
    "scada",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ymxc152/plctap"
Repository = "https://github.com/ymxc152/plctap"
Issues = "https://github.com/ymxc152/plctap/issues"

[project.scripts]
plctap = "plctap.server:main"

[project.optional-dependencies]
# scapy 仅评测 harness (parse_pcap, M3) 需要, 运行时不依赖
eval = ["scapy>=2.5"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# e2e: tests/e2e 用第三方权威实现做交叉验证 (uv sync --group e2e)
e2e = [
    "pymodbus>=3.9",
    "python-snap7>=3.1",
    "pymcprotocol>=0.3",
    "fins>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plctap"]

# sdist 排除本机敏感配置 (.claude/ 含本地路径与权限模型, 不得进 PyPI)
[tool.hatch.build.targets.sdist]
exclude = [
    ".claude/**",
    ".venv/**",
    ".pytest_cache/**",
    "**/__pycache__/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: 跨厂商实机交叉验证 (需要 --group e2e 的第三方库; 缺库自动跳过)",
]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# scripts/ 与 tests/e2e 的启动脚本先做 stdout 编码/sys.path 设置再 import, E402 属有意为之
"scripts/*" = ["E401", "E402"]
"tests/e2e/*" = ["E402"]

