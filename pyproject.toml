[project]
name = "plctap"
version = "0.1.0"
description = "Agent-PLC MCP Server: connect, read and diagnose Modbus / FINS / MELSEC PLCs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
plctap = "plctap.server:main"

[project.optional-dependencies]
# scapy 仅评测 harness (parse_pcap, M3) 需要, 运行时不依赖
eval = ["scapy>=2.5"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plctap"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
