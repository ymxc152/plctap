name: Publish to PyPI & MCP Registry

# 打 v* 标签即触发: git tag v0.1.0 && git push origin v0.1.0
# 发布闸门: 仅允许"已合入 main 的 commit"上的 tag 触发发布 (分支上的 tag 不发布,
# 流程改为: 分支合入 main -> 在 main 上打 tag)。
# 两个发布均走 OIDC (GitHub Actions 内不需要任何 token/密码):
#   1. PyPI Trusted Publishing   — 前置一次性设置见 docs/PUBLISH.md 阶段 0.2
#   2. MCP Registry 收录 server.json — 无需注册账号, GitHub 身份即凭证 (阶段 0.3)

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write  # OIDC 签发发布凭证 (PyPI 与 MCP Registry 共用)

jobs:
  # 首闸: tag 所指 commit 必须已在 main 历史内 (annotated tag 用 ^commit 解引用)
  guard-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 校验 tag 所指 commit 已合入 main
        run: |
          git fetch origin main
          TAG_COMMIT=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")
          if git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "tag 所指 commit $(git rev-parse --short "$TAG_COMMIT") 已在 main 历史内, 放行发布"
          else
            echo "::error::tag 所指 commit 不在 main 历史内 — 请先将分支合入 main, 再在 main 上打 tag 发布"
            exit 1
          fi

  publish:
    needs: guard-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: 校验 pyproject 版本与 tag 一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::tag ($TAG_VERSION) 与 pyproject.toml version ($PYPROJECT_VERSION) 不一致"
            exit 1
          fi
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  # GitHub Release 页面: PyPI 发布成功即创建, notes 按 commit 前缀自动分类
  # (新增/修复/工程/文档/其他) + Full Changelog 链接; 区间无提交时兜底 --generate-notes
  # —— 任何情况下 Release 页面不得空白 (规则见 docs/PUBLISH.md「GitHub Release notes 规则」)
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 仅本 job 需要: 创建/更新 Release 对象
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史定位上一个 tag 与提交区间
      - name: Create GitHub Release (categorized notes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
          git log --pretty=format:"%s" "$RANGE" > /tmp/commits.txt

          if [ -s /tmp/commits.txt ]; then
            {
              echo "## plctap $TAG"
              echo ""
              echo "本版变化由 CI 按提交自动生成（区间 \`${RANGE}\`）；版本叙事见 [PLAN.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/PLAN.md) 对应里程碑。"
              echo ""
              git log --pretty=format:"%s" "$RANGE" | awk '
                { if      ($0 ~ /^feat/ || $0 ~ /^add/ || $0 ~ /^新增/) c = "feat"
                  else if ($0 ~ /^fix/ || $0 ~ /^修复/)                 c = "fix"
                  else if ($0 ~ /^ci/ || $0 ~ /^chore/ || $0 ~ /^build/ || $0 ~ /^release/ || $0 ~ /^merge/) c = "eng"
                  else if ($0 ~ /^docs/ || $0 ~ /^文档/)                c = "docs"
                  else                                                  c = "misc"
                  body[c] = body[c] "- " $0 "\n" }
                END { n = split("feat|fix|eng|docs|misc", keys, "|")
                      split("✨ 新增 / 能力|🐛 修复|🔧 工程 / CI / 发布|📝 文档|♻️ 其他变更", titles, "|")
                      for (i = 1; i <= n; i++) if (keys[i] in body) { print "### " titles[i]; printf "%s", body[keys[i]]; print "" } }'
              echo "---"
              if [ -n "$PREV" ]; then
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
              fi
            } > /tmp/body.md
            ARGS=(--notes-file /tmp/body.md)
          else
            ARGS=(--generate-notes)  # 兜底: 区间无提交也要有 notes, 页面永不空白
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在 (人工撰写优先), CI 不覆盖 —— 保证页面不空白靠自动创建, 不靠改写"
          else
            gh release create "$TAG" --verify-tag --title "plctap $TAG" "${ARGS[@]}"
            echo "Release $TAG 已创建 (categorized notes)"
          fi

  # MCP Registry 收录: server.json 里引用的 pypi 包版本会被 registry 校验真实存在,
  # 因此必须等 publish (PyPI) 成功后再发, 且要等 PyPI 索引对 CDN 生效。
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: server.json 版本对齐 tag (两级 version 一并改)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp && mv server.tmp server.json
      - name: 等待 PyPI 索引生效 (最多 5 分钟)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if curl -fsSL "https://pypi.org/pypi/plctap/$VERSION/json" > /dev/null 2>&1; then
              echo "plctap==$VERSION 已在 PyPI 可见"
              exit 0
            fi
            echo "等待中... ($i/30)"
            sleep 10
          done
          echo "::error::5 分钟内 PyPI 未出现 plctap==$VERSION"
          exit 1
      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish server.json
